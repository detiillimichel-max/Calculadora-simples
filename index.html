<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Orbital - OIO</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#e8f5e9">
</head>
<body>
    <div class="glass-container">
        <header class="app-header">
            <h1>Calculadora</h1>
        </header>

        <main class="calc-wrapper">
            <div class="display-container">
                <div id="prev-operation" class="prev-op"></div>
                <div id="current-display" class="main-display">0</div>
            </div>

            <div class="orbital-grid">
                <button class="btn func span-two" data-action="clear">AC</button>
                <button class="btn func" data-action="delete">DEL</button>
                <button class="btn op" data-op="/">÷</button>
                
                <button class="btn num">7</button>
                <button class="btn num">8</button>
                <button class="btn num">9</button>
                <button class="btn op" data-op="*">×</button>
                
                <button class="btn num">4</button>
                <button class="btn num">5</button>
                <button class="btn num">6</button>
                <button class="btn op" data-op="-">−</button>
                
                <button class="btn num">1</button>
                <button class="btn num">2</button>
                <button class="btn num">3</button>
                <button class="btn op" data-op="+">+</button>
                
                <button class="btn num span-two">0</button>
                <button class="btn num">.</button>
                <button class="btn equal" id="btn-equal">=</button>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
